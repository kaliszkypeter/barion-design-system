<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Barion — Log in (prototype)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../brand-tokens.css">
<style>
*, *::before, *::after { box-sizing: border-box; }

/* Fix: hidden attribute wins even when display:flex is set */
[hidden] { display: none !important; }

/* ---- Component styles (from index.html — brand-tokens.css only has tokens) ---- */

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2); height: 46px; padding: 14px var(--s-4); border-radius: var(--radius-sm); font-family: var(--font-brand); font-weight: var(--fw-semibold); font-size: var(--fs-body); cursor: pointer; transition: filter var(--dur-button) var(--ease-in-out), background var(--dur-button) var(--ease-in-out); border: 0; box-shadow: none; line-height: 1; }
.btn:focus-visible { box-shadow: var(--shadow-focus); outline: none; }
.btn:disabled { background: var(--surface-disabled); color: var(--text-disabled); cursor: not-allowed; }
.btn--primary { background: var(--gradient-brand-button); color: var(--text-invert); }
.btn--primary:hover:not(:disabled) { background-image: linear-gradient(rgba(0,0,0,0.05), rgba(0,0,0,0.05)), var(--gradient-brand-button); }
.btn--primary:active:not(:disabled) { filter: brightness(0.78); }
.btn--primary:focus-visible:not(:disabled) { background-image: linear-gradient(rgba(0,0,0,0.10),rgba(0,0,0,0.10)),var(--gradient-brand-button); box-shadow: 0 0 0 3px var(--blue-300); }
.btn--secondary { background: var(--surface-primary); color: var(--text-primary); border: 1px solid var(--border-secondary); }
.btn--secondary:hover:not(:disabled) { background: var(--white-gray); }
.btn--secondary:active:not(:disabled) { background: #EFEFEF; }
.btn--tertiary { background: transparent; color: var(--text-link-1); border: 0; box-shadow: none; }
.btn--tertiary:hover:not(:disabled) { background: var(--white-gray); }
.btn--tertiary:active:not(:disabled) { background: var(--blue-50); }
.btn--link { background: transparent; color: var(--text-link-1); font-weight: var(--fw-semibold); font-size: var(--fs-body-sm); padding: 0; height: auto; border: 0; cursor: pointer; font-family: var(--font-brand); }
.btn--link:hover:not(:disabled) { text-decoration: underline; color: var(--text-link-2); }
.btn--sm { height: 32px; padding: 4px 10px 6px; font-size: var(--fs-body-sm); border-radius: var(--radius-xs); }
.btn-icon { display: inline-grid; place-content: center; background: transparent; border: 0; border-radius: var(--radius-xs); color: var(--icon-primary); cursor: pointer; transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out); outline: none; flex-shrink: 0; }
.btn-icon:hover:not(:disabled) { background: var(--blue-50); color: var(--text-brand); }
.btn-icon--l { width: 36px; height: 36px; }
.btn-icon--l .icon { width: 20px; height: 20px; }
.icon { width: 20px; height: 20px; flex-shrink: 0; display: inline-block; vertical-align: middle; color: var(--icon-primary); }

/* Inputs */
.field { display: flex; flex-direction: column; gap: 4px; width: 100%; }
.field__label { font-family: var(--font-brand); font-weight: var(--fw-semibold); font-size: var(--fs-body); color: var(--text-primary); }
.field__input { height: 44px; padding: 10px 12px; border-radius: var(--radius-xs); border: 1px solid var(--border-secondary); background: var(--surface-primary); font-family: var(--font-brand); font-weight: var(--fw-semilight); font-size: var(--fs-body); color: var(--text-primary); transition: border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out); width: 100%; box-sizing: border-box; box-shadow: none; outline: none; }
.field__input::placeholder { color: var(--text-inactive); }
.field__input:hover:not(:disabled):not(:focus) { border-color: var(--border-strong); }
.field__input:focus { border-color: var(--blue-200); box-shadow: var(--shadow-focus); }

/* Avatars */
.avatar { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--grey-200); color: var(--grey-700); font-family: var(--font-brand); font-weight: var(--fw-semibold); flex-shrink: 0; user-select: none; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar--sm { width: 32px; height: 32px; font-size: 12px; }
.avatar--darkblue { background: #047CD2; color: #FFFFFF; }
.avatar--shop     { background: #195796; color: #FFFFFF; }

/* List selector */
.list-selector { display: flex; flex-direction: column; gap: var(--s-2); background: var(--white-gray); padding: var(--s-2); border-radius: var(--radius-sm); width: 100%; }
.list-selector-item { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-3) var(--s-4); background: var(--surface-primary); border-radius: var(--radius-xs); cursor: pointer; transition: background var(--dur-fast) var(--ease-out); }
.list-selector-item:hover:not([aria-selected="true"]) { background: var(--white-gray); }
.list-selector-item--action { cursor: pointer; }
.list-selector-item--action:hover { background: var(--blue-50) !important; }
.list-selector-item--action:focus-visible { outline: none; box-shadow: var(--shadow-focus); }
.list-selector-item[aria-selected="true"] { background: var(--blue-50); }
.list-selector-item__body { display: flex; flex-direction: column; gap: 0; min-width: 0; flex: 1; }
.list-selector-item__title { font-weight: var(--fw-semibold); font-size: var(--fs-body-sm); color: var(--text-primary); line-height: 1.3; }
.list-selector-item[aria-selected="true"] .list-selector-item__title { color: var(--text-brand); }
.list-selector-item__sub { font-weight: var(--fw-semilight); font-size: var(--fs-body-xs); color: var(--text-secondary); line-height: 1.3; }
.list-selector-item[aria-selected="true"] .list-selector-item__sub { color: var(--text-brand); }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--white-gray);
  display: flex;
  flex-direction: column;
  font-family: var(--font-brand);
}

/* ---- Header ---- */
.login-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 32px;
  background: var(--surface-primary);
  border-bottom: 1px solid var(--border-secondary);
}
.login-header__logo { height: 26px; width: auto; display: block; }
.login-header__right { display: flex; align-items: center; gap: var(--s-5); }

.lang-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: none;
  border: 1px solid var(--border-secondary);
  border-radius: var(--radius-xs);
  padding: 5px 10px;
  font-family: var(--font-brand);
  font-size: var(--fs-body-sm);
  font-weight: var(--fw-semilight);
  color: var(--text-primary);
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease-out);
}
.lang-btn:hover { background: var(--white-gray); }

.login-header__help {
  font-size: var(--fs-body-sm);
  font-weight: var(--fw-semibold);
  color: var(--text-link-1);
  text-decoration: none;
}
.login-header__help:hover { text-decoration: underline; }

/* ---- Main ---- */
.login-main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--s-8) var(--s-4);
}

/* ---- Card ---- */
.login-card {
  background: var(--surface-primary);
  border: 1px solid var(--border-secondary);
  border-radius: var(--radius-md);
  padding: var(--s-8);
  width: 100%;
  max-width: 400px;
}

/* ---- State wrapper ---- */
.login-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--s-5);
}
.login-state--left { align-items: stretch; }

/* ---- State transitions ---- */
.login-state.is-out {
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--dur-fast) var(--ease-out);
}
.login-state.is-in {
  opacity: 1;
  transition: opacity var(--dur-base) var(--ease-out);
}

/* ---- Headings ---- */
.state-heading {
  font-weight: var(--fw-semibold);
  font-size: var(--fs-h3);
  color: var(--text-primary);
  margin: 0;
  text-align: center;
  align-self: center;
}

/* ---- State A: account list + actions ---- */
.state-a__list { width: 100%; }

.state-a__actions {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--s-5);
  width: 100%;
}

/* ---- State B: account chip ---- */
.account-chip {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  background: var(--white-gray);
  border-radius: var(--radius-xs);
  padding: var(--s-2) var(--s-3);
}
.account-chip__info { flex: 1; min-width: 0; }
.account-chip__name {
  display: block;
  font-weight: var(--fw-semibold);
  font-size: var(--fs-body-sm);
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.account-chip__email {
  display: block;
  font-size: var(--fs-body-xs);
  font-weight: var(--fw-semilight);
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ---- Auth forms ---- */
.auth-form { display: flex; flex-direction: column; gap: var(--s-4); }
.auth-form__title { font-weight: var(--fw-semibold); font-size: var(--fs-body); color: var(--text-primary); margin: 0; }
.field__input-wrap { position: relative; }
.field__input-wrap .field__input { padding-right: 44px; }
.field__input-wrap .btn-icon {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--icon-secondary);
}

/* ---- Push illustration ---- */
.push-illus {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--s-3);
  background: var(--blue-50);
  border-radius: var(--radius-sm);
  padding: var(--s-6) var(--s-5);
  text-align: center;
}
.push-illus__icon {
  width: 60px;
  height: 60px;
  background: var(--surface-primary);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 8px rgba(44, 52, 70, 0.10);
}
.push-illus__icon svg { animation: push-pulse 2.4s var(--ease-out) infinite; }
@keyframes push-pulse {
  0%   { opacity: 1; transform: scale(1); }
  50%  { opacity: 0.65; transform: scale(0.94); }
  100% { opacity: 1; transform: scale(1); }
}
.push-illus__text {
  font-size: var(--fs-body-sm);
  font-weight: var(--fw-semilight);
  color: var(--text-secondary);
  line-height: var(--lh-body);
  margin: 0;
  max-width: 240px;
}

/* ---- Dropdown (account switcher for 2+ accounts) ---- */
.dropdown { position: relative; width: 100%; }
.dropdown__trigger { display: flex; align-items: center; justify-content: space-between; gap: var(--s-2); height: 46px; padding: 10px 16px; background: var(--surface-primary); border: 1px solid var(--border-secondary); border-radius: var(--radius-sm); font-family: var(--font-brand); font-weight: var(--fw-semilight); font-size: var(--fs-body); color: var(--text-primary); cursor: pointer; width: 100%; box-sizing: border-box; outline: none; text-align: left; transition: border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out); }
.dropdown__trigger:hover { background-image: linear-gradient(rgba(44,52,70,0.04), rgba(44,52,70,0.04)); }
.dropdown__trigger:focus-visible { border-color: var(--blue-200); box-shadow: var(--shadow-focus); }
.dropdown[data-open="true"] .dropdown__trigger { border-color: var(--blue-200); box-shadow: var(--shadow-focus); }
.dropdown__value { display: flex; align-items: center; gap: var(--s-2); flex: 1; min-width: 0; }
.dropdown__chevron { width: 16px; height: 16px; flex-shrink: 0; color: var(--text-secondary); transition: transform var(--dur-fast) var(--ease-out); }
.dropdown[data-open="true"] .dropdown__chevron { transform: rotate(180deg); }
.dropdown__menu { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--surface-primary); border: 1px solid var(--border-secondary); border-radius: var(--radius-sm); box-shadow: var(--shadow-overlay); padding: 6px; display: none; z-index: 100; }
.dropdown[data-open="true"] .dropdown__menu { display: block; }
.menu-item { display: flex; align-items: center; gap: var(--s-3); padding: 0 12px; height: 44px; border-radius: var(--radius-xs); font-family: var(--font-brand); font-weight: var(--fw-semilight); font-size: var(--fs-body); color: var(--text-primary); cursor: pointer; transition: background var(--dur-fast) var(--ease-out); }
.menu-item:hover { background: var(--white-gray); }
.menu-item[aria-selected="true"] { background: var(--blue-50); color: var(--text-brand); font-weight: var(--fw-semibold); }
.menu-item[aria-selected="true"]::after { content: "✓"; margin-left: auto; color: var(--blue-500); font-weight: var(--fw-bold); }
.trigger-name { font-weight: var(--fw-semibold); font-size: var(--fs-body-sm); }
.trigger-email { font-size: var(--fs-body-xs); color: var(--text-secondary); font-weight: var(--fw-semilight); }

/* ---- Misc ---- */
.login-divider { width: 100%; border: none; border-top: 1px solid var(--border-secondary); margin: 0; }
.signup-prompt { font-size: var(--fs-body-sm); font-weight: var(--fw-semilight); color: var(--text-secondary); margin: 0; text-align: center; }
.signup-prompt a { font-weight: var(--fw-semibold); color: var(--text-link-1); text-decoration: none; }
.signup-prompt a:hover { text-decoration: underline; }
.btn--full { width: 100%; justify-content: center; }

/* ---- Footer ---- */
.login-footer { display: flex; align-items: center; justify-content: center; gap: var(--s-3); padding: var(--s-4); }
.login-footer a { font-size: var(--fs-body-sm); font-weight: var(--fw-semilight); color: var(--text-secondary); text-decoration: none; }
.login-footer a:hover { color: var(--text-primary); text-decoration: underline; }
.login-footer__sep { color: var(--text-inactive); font-size: var(--fs-body-sm); }

/* ---- Dev toggle (prototype only) ---- */
.dev-toggle {
  position: fixed;
  bottom: var(--s-4);
  right: var(--s-4);
  background: var(--surface-primary);
  border: 1px solid var(--border-secondary);
  border-radius: var(--radius-sm);
  padding: var(--s-3) var(--s-4);
  box-shadow: var(--shadow-overlay);
  z-index: 999;
  display: flex;
  flex-direction: column;
  gap: var(--s-2);
}
.dev-toggle__label { font-size: var(--fs-body-xs); font-weight: var(--fw-semibold); color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }
.dev-toggle__btns { display: flex; gap: var(--s-2); }
.dev-toggle__btn {
  height: 30px;
  padding: 0 var(--s-3);
  background: var(--white-gray);
  border: 1px solid var(--border-secondary);
  border-radius: var(--radius-xs);
  font-family: var(--font-brand);
  font-size: var(--fs-body-sm);
  font-weight: var(--fw-semibold);
  color: var(--text-secondary);
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
}
.dev-toggle__btn:hover { background: var(--blue-50); color: var(--text-brand); }
.dev-toggle__btn.is-active { background: var(--blue-50); color: var(--text-brand); border-color: var(--blue-200); }

/* ---- Mobile ---- */
@media (max-width: 480px) {
  .login-header { padding: 16px 20px; }
  .login-main { padding: 0; align-items: flex-start; }
  .login-card { border-radius: 0; border-left: 0; border-right: 0; max-width: 100%; padding: var(--s-6); }
  .dev-toggle { bottom: var(--s-3); right: var(--s-3); }
}
</style>
</head>
<body>

<!-- ==================== HEADER ==================== -->
<header class="login-header">
  <img src="../assets/barion-wordmark.svg" alt="Barion" class="login-header__logo">
  <div class="login-header__right">
    <button class="lang-btn" type="button">
      EN
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
        <path d="M2.5 4.5L6 8L9.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <a href="#" class="login-header__help">Help</a>
  </div>
</header>

<!-- ==================== MAIN ==================== -->
<main class="login-main">
  <div class="login-card">

    <!-- ===== STATE A: Account Picker ===== -->
    <div id="state-a" class="login-state">
      <h2 class="state-heading">Welcome back</h2>
      <div class="state-a__list">
        <!-- n=1: plain non-selected item, injected by renderA -->
        <div id="view-single"></div>
        <!-- n=2: dropdown, injected by renderA -->
        <div id="view-dropdown" class="dropdown" hidden></div>
      </div>
      <div class="state-a__actions">
        <button id="btn-continue" class="btn btn--primary btn--full" onclick="continueFromPicker()">Continue</button>
        <button id="link-another" class="btn btn--link" onclick="go('c')">Use another account</button>
      </div>
    </div>

    <!-- ===== STATE B: Auth Step ===== -->
    <div id="state-b" class="login-state login-state--left" hidden>

      <div class="account-chip">
        <span class="avatar avatar--sm avatar--darkblue" id="chip-avatar">KA</span>
        <div class="account-chip__info">
          <span class="account-chip__name" id="chip-name">Kovács Anna</span>
          <span class="account-chip__email" id="chip-email">anna.kovacs@example.com</span>
        </div>
        <button class="btn btn--link" style="font-size:var(--fs-body-sm);white-space:nowrap" onclick="go('a')">Not you?</button>
      </div>

      <!-- Password variant -->
      <div id="auth-password" class="auth-form">
        <p class="auth-form__title">Enter your password</p>
        <div class="field">
          <label class="field__label" for="field-password">Password</label>
          <div class="field__input-wrap">
            <input class="field__input" type="password" id="field-password" autocomplete="current-password">
            <button class="btn-icon btn-icon--l" type="button" onclick="togglePassword()" title="Show password">
              <svg class="icon" viewBox="0 0 20 20" fill="none">
                <path d="M1.5 10C1.5 10 4.5 4 10 4C15.5 4 18.5 10 18.5 10C18.5 10 15.5 16 10 16C4.5 16 1.5 10 1.5 10Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/>
              </svg>
            </button>
          </div>
        </div>
        <button class="btn btn--primary btn--full" type="button">Log in</button>
        <div style="text-align:center">
          <button class="btn btn--link" type="button">Forgot your password?</button>
        </div>
      </div>

      <!-- Push / biometric variant -->
      <div id="auth-push" class="auth-form" hidden>
        <div class="push-illus">
          <div class="push-illus__icon">
            <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
              <rect x="9.5" y="3.5" width="15" height="24" rx="2.5" stroke="var(--barion-blue)" stroke-width="1.75"/>
              <line x1="14" y1="7" x2="20" y2="7" stroke="var(--barion-blue)" stroke-width="1.5" stroke-linecap="round"/>
              <circle cx="17" cy="24" r="1.25" fill="var(--barion-blue)"/>
              <circle cx="25.5" cy="9.5" r="5.5" fill="var(--barion-blue)"/>
              <path d="M23 9.5L25 11.5L28.5 8" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <p class="push-illus__text">Approve the login request in your Barion app, or use biometrics on your registered device.</p>
        </div>
        <button class="btn btn--secondary btn--full" type="button" onclick="switchToPassword()">Use password instead</button>
        <div style="text-align:center">
          <button class="btn btn--link" type="button">Resend notification</button>
        </div>
      </div>

    </div>

    <!-- ===== STATE C: Standard Form ===== -->
    <div id="state-c" class="login-state" hidden>
      <h2 class="state-heading">Log in to Barion</h2>
      <div class="auth-form" style="width:100%">
        <div class="field">
          <label class="field__label" for="field-email">E-mail address</label>
          <input class="field__input" type="email" id="field-email" placeholder="you@example.com" autocomplete="email">
        </div>
        <button class="btn btn--primary btn--full" type="button">Next</button>
      </div>
      <hr class="login-divider">
      <p class="signup-prompt">Don't have an account? <a href="#">Sign up now!</a></p>
    </div>

  </div>
</main>

<!-- ==================== FOOTER ==================== -->
<footer class="login-footer">
  <a href="#">General Terms</a>
  <span class="login-footer__sep">·</span>
  <a href="#">Privacy Policy</a>
</footer>

<!-- ==================== DEV TOGGLE ==================== -->
<div class="dev-toggle">
  <span class="dev-toggle__label">Recognized accounts</span>
  <div class="dev-toggle__btns">
    <button class="dev-toggle__btn" onclick="setCount(0)">0</button>
    <button class="dev-toggle__btn is-active" onclick="setCount(1)">1</button>
    <button class="dev-toggle__btn" onclick="setCount(2)">2</button>
  </div>
</div>

<script>
const ACCOUNTS = [
  { name: "Kovács Anna", email: "anna.kovacs@example.com", authType: "push",     color: "darkblue" },
  { name: "Tóth Béla",   email: "bela.toth@example.com",  authType: "password", color: "shop" }
];

let count         = 1;
let selected      = ACCOUNTS[0];
let transitioning = false;

function initials(name) {
  return name.trim().split(/\s+/).map(w => w[0]).join("").toUpperCase().slice(0, 2);
}

// ---- Dev toggle ----
function setCount(n) {
  count = n;
  document.querySelectorAll(".dev-toggle__btn").forEach((b, i) => b.classList.toggle("is-active", i === n));
  selected = ACCOUNTS[0];
  if (n === 0) { go("c"); } else { renderA(n); go("a"); }
}

// ---- State A ----
function renderA(n) {
  const single   = document.getElementById("view-single");
  const dropdown = document.getElementById("view-dropdown");

  if (n === 1) {
    const acc = ACCOUNTS[0];
    single.innerHTML = `
      <div class="list-selector-item list-selector-item--action" data-idx="0" onclick="continueFromPicker()" role="button" tabindex="0">
        <span class="avatar avatar--sm avatar--${acc.color}">${initials(acc.name)}</span>
        <div class="list-selector-item__body">
          <span class="list-selector-item__title">${acc.name}</span>
          <span class="list-selector-item__sub">${acc.email}</span>
        </div>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="flex-shrink:0;color:var(--text-inactive)">
          <path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>`;
    single.hidden   = false;
    dropdown.hidden = true;
    document.getElementById("btn-continue").hidden = true;
    document.getElementById("link-another").textContent = "Not you? Use another account";
  } else {
    const sel = selected || ACCOUNTS[0];
    dropdown.removeAttribute("data-open");
    dropdown.innerHTML = `
      <button class="dropdown__trigger" type="button" onclick="toggleDropdown()">
        <div class="dropdown__value">
          <span class="avatar avatar--sm avatar--${sel.color}">${initials(sel.name)}</span>
          <div style="display:flex;flex-direction:column;gap:0;min-width:0;flex:1">
            <span class="trigger-name">${sel.name}</span>
            <span class="trigger-email">${sel.email}</span>
          </div>
        </div>
        <svg class="dropdown__chevron" viewBox="0 0 16 16" fill="none">
          <path d="M3 6L8 11L13 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="dropdown__menu">
        ${ACCOUNTS.slice(0, n).map((acc, i) => `
          <div class="menu-item" aria-selected="${acc === sel}" data-idx="${i}" onclick="selectFromDropdown(${i})">
            <span class="avatar avatar--sm avatar--${acc.color}">${initials(acc.name)}</span>
            ${acc.name}
          </div>`).join("")}
      </div>`;
    single.hidden   = true;
    dropdown.hidden = false;
    document.getElementById("btn-continue").hidden = false;
    document.getElementById("link-another").textContent = "Use another account";
  }
}

function toggleDropdown() {
  const dd = document.getElementById("view-dropdown");
  dd.setAttribute("data-open", dd.getAttribute("data-open") === "true" ? "false" : "true");
}

function selectFromDropdown(i) {
  selected = ACCOUNTS[i];
  renderA(count);
}

// ---- State B ----
function renderB(acc) {
  document.getElementById("chip-avatar").textContent = initials(acc.name);
  document.getElementById("chip-avatar").className   = `avatar avatar--sm avatar--${acc.color}`;
  document.getElementById("chip-name").textContent   = acc.name;
  document.getElementById("chip-email").textContent  = acc.email;
  document.getElementById("auth-password").hidden    = acc.authType !== "password";
  document.getElementById("auth-push").hidden        = acc.authType !== "push";
}

function continueFromPicker() {
  if (count === 1) selected = ACCOUNTS[0];
  renderB(selected);
  go("b");
}

function switchToPassword() {
  document.getElementById("auth-push").hidden     = true;
  document.getElementById("auth-password").hidden = false;
}

function togglePassword() {
  const f = document.getElementById("field-password");
  f.type = f.type === "password" ? "text" : "password";
}

// ---- State machine ----
function go(target) {
  if (transitioning) return;
  const all     = ["a","b","c"].map(id => document.getElementById("state-" + id));
  const current = all.find(el => !el.hidden);
  const next    = document.getElementById("state-" + target);
  if (current === next) return;

  transitioning = true;
  current.classList.add("is-out");
  setTimeout(() => {
    current.classList.remove("is-out");
    current.hidden = true;
    next.style.opacity = "0";
    next.hidden = false;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      next.classList.add("is-in");
      next.style.opacity = "1";
      setTimeout(() => {
        next.classList.remove("is-in");
        next.style.opacity = "";
        transitioning = false;
      }, 220);
    }));
  }, 130);
}

// ---- Init ----
renderA(1);
</script>
